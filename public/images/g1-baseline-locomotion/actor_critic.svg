<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="570" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Actor vs. Critic: who sees what</text>

  <line x1="500" y1="55" x2="500" y2="540" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>

  <!-- ===== LEFT: ACTOR ===== -->
  <text x="250" y="82" text-anchor="middle" font-size="17" font-weight="700" fill="#4338ca">ACTOR (deployed policy)</text>

  <rect x="40" y="98" width="420" height="180" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="60" y="126" font-size="14.5" fill="#1e293b">• Base lin/ang vel (IMU, noisy)</text>
  <text x="60" y="152" font-size="14.5" fill="#1e293b">• Projected gravity</text>
  <text x="60" y="178" font-size="14.5" fill="#1e293b">• Velocity command</text>
  <text x="60" y="204" font-size="14.5" fill="#1e293b">• Joint pos/vel (encoders, noisy)</text>
  <text x="60" y="230" font-size="14.5" fill="#1e293b">• Last action</text>
  <text x="250" y="260" text-anchor="middle" font-size="12.5" font-style="italic" fill="#4f46e5">only what a real G1 can sense onboard</text>

  <line x1="250" y1="278" x2="250" y2="308" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="90" y="310" width="320" height="66" rx="10" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.5"/>
  <text x="250" y="335" text-anchor="middle" font-size="15.5" font-weight="700" fill="#312e81">Actor MLP</text>
  <text x="250" y="357" text-anchor="middle" font-size="13.5" fill="#312e81">256 → 128 → 128, ELU</text>

  <line x1="250" y1="376" x2="250" y2="406" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="55" y="408" width="390" height="56" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="250" y="442" text-anchor="middle" font-size="14.5" fill="#1e293b">action: per-joint position targets</text>

  <text x="250" y="510" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">✓ same weights run on the real G1</text>

  <!-- ===== RIGHT: CRITIC ===== -->
  <text x="750" y="82" text-anchor="middle" font-size="17" font-weight="700" fill="#b45309">CRITIC (training only)</text>

  <rect x="540" y="98" width="420" height="230" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="560" y="122" font-size="14.5" fill="#1e293b">• Base lin/ang vel (IMU, noisy)</text>
  <text x="560" y="144" font-size="14.5" fill="#1e293b">• Projected gravity</text>
  <text x="560" y="166" font-size="14.5" fill="#1e293b">• Velocity command</text>
  <text x="560" y="188" font-size="14.5" fill="#1e293b">• Joint pos/vel (encoders, noisy)</text>
  <text x="560" y="210" font-size="14.5" fill="#1e293b">• Last action</text>
  <line x1="560" y1="222" x2="940" y2="222" stroke="#f2c185" stroke-width="1"/>
  <text x="560" y="240" font-size="13.5" font-weight="700" fill="#b45309">+ privileged, sim-only "god mode":</text>
  <text x="560" y="260" font-size="14" fill="#9a3412">• Exact base velocity (no noise)</text>
  <text x="560" y="279" font-size="14" fill="#9a3412">• Ground-truth contact forces</text>
  <text x="560" y="298" font-size="14" fill="#9a3412">• This episode's friction/mass/motor gains</text>
  <text x="560" y="317" font-size="14" fill="#9a3412">• Push-perturbation magnitude</text>

  <line x1="750" y1="328" x2="750" y2="358" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="590" y="360" width="320" height="66" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="750" y="385" text-anchor="middle" font-size="15.5" font-weight="700" fill="#78350f">Critic MLP</text>
  <text x="750" y="407" text-anchor="middle" font-size="13.5" fill="#78350f">256 → 128 → 128, ELU</text>

  <line x1="750" y1="426" x2="750" y2="456" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="610" y="458" width="280" height="56" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="750" y="492" text-anchor="middle" font-size="14.5" fill="#1e293b">V(s): value estimate</text>

  <text x="750" y="547" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">✗ discarded after training, never deployed</text>
</svg>

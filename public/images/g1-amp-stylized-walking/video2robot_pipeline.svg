<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="260" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Video-to-robot reference motion</text>

  <!-- 5 stages -->
  <g font-size="13.5">
    <rect x="20" y="90" width="168" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="104" y="130" text-anchor="middle" fill="#1e293b">Video</text>

    <rect x="216" y="90" width="168" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="300" y="122" text-anchor="middle" fill="#312e81">3D pose</text>
    <text x="300" y="140" text-anchor="middle" fill="#312e81">estimation</text>

    <rect x="412" y="90" width="168" height="70" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="496" y="122" text-anchor="middle" fill="#78350f">SMPL</text>
    <text x="496" y="140" text-anchor="middle" fill="#78350f">parameters</text>

    <rect x="608" y="90" width="168" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="692" y="130" text-anchor="middle" fill="#312e81">Retargeting</text>

    <rect x="804" y="90" width="176" height="70" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="892" y="122" text-anchor="middle" fill="#78350f">Robot joint</text>
    <text x="892" y="140" text-anchor="middle" fill="#78350f">trajectories</text>
  </g>

  <g stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow4)">
    <line x1="188" y1="125" x2="212" y2="125"/>
    <line x1="384" y1="125" x2="408" y2="125"/>
    <line x1="580" y1="125" x2="604" y2="125"/>
    <line x1="776" y1="125" x2="800" y2="125"/>
  </g>

  <text x="500" y="200" text-anchor="middle" font-size="12.5" font-style="italic" fill="#64748b">AMASS and LAFAN1 both start from existing marker-based mocap and enter this pipeline at "Retargeting"</text>
</svg>
